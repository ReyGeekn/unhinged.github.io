<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unhinged</title>
  <link rel="stylesheet" href="main.css">
  <link rel="icon" type="image/png" href="icons/miku.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    .top-center {
      padding: 20px;
      font-size: 48px;
      font-weight: bold;
    }
    .discord {
      font-size: 18px;
      color: #aaa;
      margin-top: -10px;
    }
    /* Paused state stops animations/transitions */
    body.paused * {
      animation-play-state: paused !important;
      transition: none !important;
    }
  </style>
</head>
<body>
  <div class="top-center">Unhinged</div>
  <a href="https://discord.gg/suicides" class="discord" target="_blank">.gg/suicides</a>
  <div class="quotes">
    <div class="quote-box"><img src="" alt=""></div>
    <div class="quote-box"><img src="" alt=""></div>
    <div class="quote-box"><img src="" alt=""></div>
  </div>
  <script>
    const totalImages = 202;
    const imageBoxes = document.querySelectorAll('.quote-box img');

    function getRandomImagePath(){
      const index = Math.floor(Math.random() * totalImages) + 1;
      return `quotes/${index}.png`;
    }

    function updateImage(img) {
      const newSrc = getRandomImagePath();
      img.style.opacity = 0;
      setTimeout(() => {
        img.src = newSrc;
        img.onload = () => img.style.opacity = 1;
      }, 300);
    }

    // store intervals so we can clear them when paused
    let intervals = [];

    function startImageRotation() {
      imageBoxes.forEach(img => {
        img.src = getRandomImagePath();
        img.style.opacity = 1;
        const id = setInterval(() => updateImage(img), 3000);
        intervals.push(id);
      });
    }

    function stopImageRotation() {
      intervals.forEach(id => clearInterval(id));
      intervals = [];
    }

    // Start initially
    startImageRotation();

    // Pause/resume with spacebar
    let paused = false;
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault(); // stop page from scrolling
        paused = !paused;
        document.body.classList.toggle("paused", paused);

        if (paused) {
          stopImageRotation();
        } else {
          startImageRotation();
        }
      }
    });
  </script>
</body>
</html>
